name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 es la versión mínima soportada (sintaxis `X | None`)
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validar la base de conocimiento
        run: |
          python -c "from sistema_experto import cargar; b = cargar(); print(f'{len(b.reglas)} reglas, {len(b.preguntas)} preguntas: OK')"

      - name: Ejecutar pruebas (sin dependencias externas)
        run: python -m unittest -v

      - name: Instalar dependencias de la interfaz web
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas de la interfaz web
        run: python -m unittest tests.test_app -v
